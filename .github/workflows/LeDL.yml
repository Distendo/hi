name: LeDL - Linux and etc. Docker Lab. Made by Distendo

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Select OS"
        required: true
        default: ubuntu
        type: choice
        options:
          # Native runners
          - ubuntu
          - ubuntu-22-04
          - ubuntu-20-04
          - ubuntu-23-10
          - macos
          # Debian family
          - debian
          - debian-12
          - debian-11
          - debian-10
          - debian-sid
          # Arch family
          - arch
          - arch-multilib
          - manjaro
          - endeavour
          # Red Hat family
          - fedora
          - fedora-39
          - fedora-38
          - fedora-rawhide
          - centos-7
          - centos-8
          - centos-9
          - rocky-8
          - rocky-9
          - almalinux-8
          - almalinux-9
          # SUSE
          - opensuse-leap
          - opensuse-tumbleweed
          # Security
          - kali
          - parrot
          - blackarch
          # Minimal / niche
          - alpine
          - alpine-3-17
          - alpine-3-18
          - alpine-3-19
          - alpine-edge
          - void
          - void-musl
          - gentoo
          - gentoo-openrc
          - nixos
          - nixos-unstable
          - slackware
          - linux-mint
          # Special
          - termux
          - docker-alpine

# ─────────────────────────────────────────────────────────────────────────────
# BANNER — identical on host and inside every container
# ─────────────────────────────────────────────────────────────────────────────
# clear; echo ""; echo "══════════════════════════════════════════════════════════════"; echo "                       Made by distendo"; echo "══════════════════════════════════════════════════════════════"; echo ""

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # NATIVE: Ubuntu latest — full toolbox + UPM
  # ═══════════════════════════════════════════════════════════════════════════
  ubuntu:
    if: github.event.inputs.os == 'ubuntu'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Install toolbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            tmate tmux screen htop vim nano git curl wget \
            build-essential gcc g++ make cmake autoconf automake \
            python3 python3-pip python3-venv nodejs npm \
            ruby rustc cargo golang-go php php-cli perl \
            net-tools iputils-ping dnsutils traceroute \
            strace ltrace gdb valgrind clang clang-format \
            openssh-client rsync jq bc dc \
            unzip zip tar gzip bzip2 xz-utils \
            fzf ripgrep fd-find bat tree ncdu httpie

      - name: Install UPM (universal package manager)
        run: |
          sudo tee /usr/local/bin/upm >/dev/null << 'UPM'
          #!/bin/bash
          RED='\033[0;31m'; NC='\033[0m'
          [ $# -eq 0 ] && { echo "Usage: upm {install|remove|update|upgrade|search|info|clean|list} <pkg>"; exit 1; }
          CMD=$1; PKG=$2
          detect_pm() {
            for pm in apt-get pacman dnf yum zypper apk xbps-install emerge nix-env brew; do
              command -v "$pm" &>/dev/null && { echo "$pm"; return; }
            done
            echo unknown
          }
          PM=$(detect_pm); [ "$PM" = unknown ] && { echo -e "${RED}No package manager${NC}"; exit 1; }
          run() { case "$PM" in
            apt-get) sudo apt-get "$@" ;;
            pacman)  case "$1" in install) sudo pacman -S --noconfirm "$PKG";; remove) sudo pacman -R --noconfirm "$PKG";; esac ;;
            dnf|yum) sudo "$PM" "$@" ;;
            zypper)  sudo zypper "$@" ;;
            apk)     case "$1" in install) sudo apk add --no-cache "$PKG";; remove) sudo apk del "$PKG";; esac ;;
            xbps-install) case "$1" in install) sudo xbps-install -Sy "$PKG";; remove) sudo xbps-remove -R "$PKG";; esac ;;
            emerge)  case "$1" in install) sudo emerge --ask=n "$PKG";; remove) sudo emerge --unmerge --ask=n "$PKG";; esac ;;
            nix-env) case "$1" in install) nix-env -iA "nixpkgs.$PKG";; remove) nix-env --uninstall "$PKG";; esac ;;
            brew)    brew "$@" ;;
          esac; }
          case "$CMD" in
            install)   run install -y "$PKG" 2>/dev/null || run install "$PKG" ;;
            remove|uninstall) run remove "$PKG" ;;
            update)    run update ;;
            upgrade)   run upgrade ;;
            search)    run search "$PKG" ;;
            info)      run info "$PKG" ;;
            clean)     run clean ;;
            list)      run list ;;
            *) echo "Unknown command: $CMD" ;;
          esac
          UPM
          sudo chmod +x /usr/local/bin/upm

      - name: Inject "Made by distendo" banner
        run: |
          BANNER='clear; echo ""; echo "══════════════════════════════════════════════════════════════"; echo "                       Made by distendo"; echo "══════════════════════════════════════════════════════════════"; echo ""'
          for f in ~/.bashrc ~/.bash_profile ~/.profile ~/.zshrc; do
            grep -q "Made by distendo" "$f" 2>/dev/null || echo "$BANNER" >> "$f"
          done

      - name: Start tmate SSH session
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 350
        with:
          limit-access-to-actor: false

      - name: Keep alive
        if: always()
        run: sleep 350m


  # ═══════════════════════════════════════════════════════════════════════════
  # NATIVE: Ubuntu 22.04 / 20.04 / 23.10
  # ═══════════════════════════════════════════════════════════════════════════
  ubuntu-22-04:
    if: github.event.inputs.os == 'ubuntu-22-04'
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          sudo apt-get update -qq && sudo apt-get install -y tmate
          BANNER='clear; echo ""; echo "══════════════════════════════════════════════════════════════"; echo "                       Made by distendo"; echo "══════════════════════════════════════════════════════════════"; echo ""'
          echo "$BANNER" >> ~/.bashrc
      - uses: mxschmitt/action-tmate@v3
        timeout-minutes: 350
        with: { limit-access-to-actor: false }
      - if: always()
        run: sleep 350m

  ubuntu-20-04:
