  ubuntu-23-10:
    if: github.event.inputs.os == 'ubuntu-23-10'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Launch ubuntu:23.10 with tmate
        run: |
          docker run -dit --name os ubuntu:23.10
          docker exec os apt-get update -qq
          docker exec os apt-get install -y --no-install-recommends tmate bash
          docker exec -i os tee -a /root/.bashrc >/dev/null << 'EOF'

          clear
          echo ""
          echo "══════════════════════════════════════════════════════════════"
          echo "                       Made by distendo"
          echo "══════════════════════════════════════════════════════════════"
          echo ""
          EOF
          docker exec -d os tmate -S /tmp/tmate.sock new-session -d
          docker exec os tmate -S /tmp/tmate.sock wait tmate-ready
          echo "══════════════════════════════════════════════════════════════"
          echo "🐧 OS: ubuntu:23.10"
          echo "🔐 SSH: $(docker exec os tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')"
          echo "🌐 WEB: $(docker exec os tmate -S /tmp/tmate.sock display -p '#{tmate_web}')"
          echo "══════════════════════════════════════════════════════════════"
      - if: always()
        run: sleep 350m


