name: Kali Linux SSH

on:
  workflow_dispatch:

jobs:
  kali:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Start Docker
        run: |
          docker pull kalilinux/kali-rolling

      - name: Run Kali container
        run: |
          docker run -d --name kali \
            --hostname kali \
            --tty \
            kalilinux/kali-rolling sleep infinity

      - name: Install tools in Kali
        run: |
          docker exec kali apt update
          docker exec kali apt install -y --no-install-recommends \
            nmap netcat-traditional curl wget git python3 nano openssh-server

      - name: Configure Kali SSH
        run: |
          docker exec kali bash -c "mkdir -p /run/sshd && echo 'root:kali' | chpasswd && sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config && /usr/sbin/sshd"
          docker exec kali bash -c "apt install -y openssh-server || true"

      - name: Install tmate
        run: |
          sudo apt update
          sudo apt install -y tmate

      - name: Open SSH tunnel (tmate)
        run: |
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          echo "=================================================="
          echo "SSH INTO THE RUNNER:"
          tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}'
          echo ""
          echo "ONCE INSIDE THE RUNNER, ENTER KALI WITH:"
          echo "  docker exec -it kali bash"
          echo "=================================================="

      - name: Keep alive
        run: |
          while true; do
            echo "Kali container running..."
            docker ps --filter name=kali --format 'table {{.Names}}\t{{.Status}}'
            sleep 60
          done
